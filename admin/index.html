<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://api.web3forms.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.firebaseapp.com; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ব্যবস্থাপনা — বই জংশন</title>
<style>
@font-face{font-family:"AK Serif";src:url("/ak-serif.woff?v=3") format("woff");font-weight:400 500;font-display:swap}
@font-face{font-family:"AK Tiro";src:url("/ak-tiro.woff?v=3") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"AK Sans";src:url("/ak-sans.woff?v=3") format("woff");font-weight:300 600;font-display:swap}
:root{--gold:#c9a45c;--ink:#0e0d0b;--card:#17140f;--line:rgba(201,164,92,.3);--mute:#a59c8b}
*{box-sizing:border-box}
html{background:var(--ink)}body{margin:0;color:#ece6d8;font-family:"AK Sans",sans-serif;line-height:1.7;font-size:16px}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}a{color:#e2c98f}
h1{font-family:"AK Tiro",serif;font-weight:400;font-size:30px;margin:0 0 4px}h2{font-family:"AK Tiro",serif;font-weight:400;font-size:21px;margin:26px 0 10px}
.btn{font:inherit;font-size:15px;padding:9px 18px;border:1px solid var(--gold);background:var(--gold);color:#1a1508;border-radius:6px;cursor:pointer}
.btn.o{background:transparent;color:#e2c98f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.st{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.st b{display:block;font-family:"AK Tiro",serif;font-weight:400;font-size:26px;color:#f3e3bd}.st span{font-size:13.5px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:6px}.bars div{flex:1;background:linear-gradient(var(--gold),#8a6a2c);border-radius:3px 3px 0 0;min-height:2px;position:relative}.bars small{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
.lbls{display:flex;gap:5px}.lbls span{flex:1;text-align:center;font-size:10.5px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14.5px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500}td.n,th.n{text-align:right}
.ord{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ord header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.ord header b{color:#f3e3bd;letter-spacing:.03em}.ord header span{color:var(--mute);font-size:13.5px}
.ord p{margin:2px 0;font-size:15px}.ord ul{margin:6px 0 8px;padding-left:20px}
.tag{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12.5px;border:1px solid var(--line);color:var(--mute)}
select,input[type=search]{font:inherit;font-size:15px;padding:8px 10px;color:#ece6d8;background:#100e0a;border:1px solid var(--line);border-radius:6px}
.note{color:var(--mute);font-size:14px}.err{color:#ff8a8a}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>ব্যবস্থাপনা</h1>
<p class="note"><a href="/">← সাইটে ফিরুন</a> · শুধু আপনার জন্য। এই পাতা গুগলে আসে না।</p>
<div id="auth"><p>আপনার অ্যাকাউন্ট দিয়ে ঢুকুন।</p><button class="btn" id="login">Google দিয়ে ঢুকুন</button> <span id="msg" class="note"></span><p class="note">অথবা ইমেইল লিংকে:</p><input id="email" type="email" placeholder="আপনার ইমেইল" style="padding:10px;border-radius:8px;width:70%"> <button class="btn" id="esend">লিংক পাঠান</button></div>
<div id="app" class="hide">
  <div class="row" style="justify-content:space-between"><span class="note" id="who"></span><button class="btn o" id="logout">বের হন</button></div>
  <h2>এক নজরে</h2>
  <div class="stats" id="stats"></div>
  <h2>শেষ ১৪ দিনের অর্ডার</h2>
  <div class="bars" id="bars"></div><div class="lbls" id="lbls"></div>
  <h2>কোন বই কতটা যাচ্ছে</h2>
  <div style="overflow-x:auto"><table id="top"></table></div>
  <h2>অর্ডারের তালিকা</h2>
  <div class="row"><select id="fs"><option value="">সব অবস্থা</option></select><input type="search" id="fq" placeholder="নাম, ফোন বা নম্বর খুঁজুন" style="flex:1;min-width:180px"><button class="btn o" id="csv">CSV নামান</button></div>
  <p class="note" id="cnt"></p>
  <div id="list"></div>
</div>
</main>
<script src="/firebase-config.js?v=20261026c"></script>
<script type="module" src="/admin/admin.js?v=20261031c"></script>
</body>
</html>
